server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Important for Flutter Web router to work
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Specifically prevent caching of the index.html and service worker
    location ~* \.(?:html|js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Allow caching of other static assets (images, fonts, etc.)
    location ~* \.(?:css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }
}
